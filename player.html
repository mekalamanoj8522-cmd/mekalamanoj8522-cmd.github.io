<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ALLIED Player</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .player-page {
            padding: 20px;
        }

        .back-button {
            background: #202027;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            border-radius: 14px;
            overflow: hidden;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        .player-title {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .player-note {
            margin-top: 10px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header class="header">

    <div class="logo">ALLIED</div>

</header>


<main class="player-page">

    <button
        class="back-button"
        onclick="history.back()">
        ← Back
    </button>


    <div class="player-container">

        <div id="player"></div>

    </div>


    <div class="player-title">
        ALLIED Player
    </div>

    <div class="player-note">
        YouTube video playback
    </div>

</main>


<script>

const params =
    new URLSearchParams(window.location.search);

const videoId =
    params.get("id");


if (!videoId) {

    document.getElementById("player").innerHTML =
        "<p style='color:white;padding:20px'>Video not found.</p>";

} else {

    const tag =
        document.createElement("script");

    tag.src =
        "https://www.youtube.com/iframe_api";

    document.head.appendChild(tag);

}


let alliedPlayer;


function onYouTubeIframeAPIReady() {

    alliedPlayer =
        new YT.Player("player", {

            videoId: videoId,

            playerVars: {

                autoplay: 1,

                playsinline: 1,

                rel: 0

            },

            events: {

                onReady: function(event) {

                    event.target.playVideo();

                }

            }

        });

}

</script>

</body>
</html>
